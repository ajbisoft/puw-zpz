<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Jakość powietrza{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'air_quality_search' %}">
            Air Quality App
        </a>

        <button 
            class="navbar-toggler" 
            type="button" 
            data-bs-toggle="collapse" 
            data-bs-target="#mainNavbar" 
            aria-controls="mainNavbar" 
            aria-expanded="false" 
            aria-label="Przełącz nawigację"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="navbar-nav ms-auto align-items-lg-center">

                <a class="nav-link" href="{% url 'air_quality_search' %}">
                    Sprawdź jakość
                </a>

                <a class="nav-link" href="{% url 'analytics_dashboard' %}">
                    Analityka
                </a>

                <a class="nav-link" href="{% url 'stations_map' %}">
                    Mapa
                </a>

                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'my_locations' %}">
                        Moje stacje
                    </a>

                    <a class="nav-link" href="{% url 'dashboard' %}">
                        Panel
                    </a>

                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link">
                            Wyloguj
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">
                        Logowanie
                    </a>

                    <a class="nav-link" href="{% url 'register' %}">
                        Rejestracja
                    </a>
                {% endif %}

            </div>
        </div>
    </div>
</nav>

<main class="container py-4">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button 
                    type="button" 
                    class="btn-close" 
                    data-bs-dismiss="alert" 
                    aria-label="Zamknij"
                ></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</main>

<script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
